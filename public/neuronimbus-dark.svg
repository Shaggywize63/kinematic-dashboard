<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 44" fill="none" role="img" aria-label="Neuronimbus">
  <!--
    Neuronimbus partner mark — dark-surface variant (white wordmark).
    Recreated as scalable artwork for the demo dashboard header. Replace this
    file with the official Neuronimbus SVG/PNG for pixel-perfect brand fidelity;
    no code change is needed (NeuronimbusLogo.tsx references it by path).
  -->
  <g stroke="#1B3E70" stroke-width="1.7" stroke-linecap="round">
    <line x1="13" y1="11" x2="30" y2="9"/>
    <line x1="30" y1="9"  x2="40" y2="20"/>
    <line x1="13" y1="11" x2="22" y2="22"/>
    <line x1="22" y1="22" x2="40" y2="20"/>
    <line x1="22" y1="22" x2="11" y2="31"/>
    <line x1="11" y1="31" x2="31" y2="33"/>
    <line x1="22" y1="22" x2="31" y2="33"/>
    <line x1="13" y1="11" x2="11" y2="31"/>
    <line x1="40" y1="20" x2="31" y2="33"/>
  </g>
  <g fill="#A9CBEC" stroke="#1B3E70" stroke-width="1.7">
    <circle cx="13" cy="11" r="5.5"/>
    <circle cx="30" cy="9"  r="4"/>
    <circle cx="40" cy="20" r="5.5"/>
    <circle cx="22" cy="22" r="3.5"/>
    <circle cx="11" cy="31" r="4"/>
    <circle cx="31" cy="33" r="5"/>
  </g>
  <text x="54" y="30" font-family="'Poppins','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.4" fill="#FFFFFF">neuronimbus</text>
</svg>
