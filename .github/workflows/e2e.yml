name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pinned to Ubuntu 24.04: the `ubuntu-latest` image moved to 26.04, which this Playwright version does not support
  # ("Playwright does not support chromium on ubuntu26.04-x64"), so every browser install failed before any test ran.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    # Backstop: cap the whole job so a stalled step fails fast (and is
    # diagnosable) instead of hanging for hours. The serial suite now runs
    # ~15 min, so keep comfortable headroom above the E2E step's own cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # Fetch the Chromium binary from Playwright's CDN. This is fast and
      # reliable (no apt), so it stays a hard requirement.
      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "browser download failed after 3 attempts"
          exit 1

      # OS libraries via `playwright install-deps` shell out to apt-get, which
      # has intermittently HUNG on the runner's Ubuntu mirror
      # (azure.archive.ubuntu.com) — and killing a hung apt-get leaves a stale
      # dpkg/apt lock that breaks the next attempt. So: clean stale locks first,
      # cap each attempt with `timeout`, retry — and treat this as best-effort
      # (continue-on-error), because GitHub's ubuntu-latest image already ships
      # Chromium's runtime libs (this is why the suite has passed without it).
      - name: Install Playwright OS deps (best-effort)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo pkill -9 -f apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/apt/lists/lock-frontend \
              /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            if sudo timeout 180 npx playwright install-deps chromium; then
              echo "OS deps installed on attempt $attempt"; exit 0
            fi
            echo "install-deps attempt $attempt stalled/failed; retrying..."
            sleep 5
          done
          echo "install-deps did not complete; continuing (runner likely already has the libs)"

      - name: Run E2E tests
        # The suite runs serially (workers: 1, one shared dev server) and has grown with the app: it was
        # ~8 min, then ~12 min, then ~15 min (599 specs), and it now takes 24 to 26 minutes (about 900 specs)
        # depending on runner load, so a 25-minute cap timed out at spec 895 of 899 with every spec passing.
        # 33 leaves headroom inside the 45-minute job limit. Splitting the suite into shards is the next step
        # if it keeps growing.
        timeout-minutes: 33
        env:
          # HRMS specs and the report/widget specs run in their own jobs below so this one keeps its headroom.
          PW_SKIP_HRMS: '1'
          PW_SKIP_PLUS: '1'
        run: npx playwright test --reporter=list

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  e2e-hrms:
    name: Playwright E2E (HRMS)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "browser download failed after 3 attempts"
          exit 1

      # Same best-effort OS deps step as the main job (see the comment there).
      - name: Install Playwright OS deps (best-effort)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo pkill -9 -f apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/apt/lists/lock-frontend \
              /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            if sudo timeout 180 npx playwright install-deps chromium; then
              echo "OS deps installed on attempt $attempt"; exit 0
            fi
            echo "install-deps attempt $attempt stalled/failed; retrying..."
            sleep 5
          done
          echo "install-deps did not complete; continuing (runner likely already has the libs)"

      - name: Run HRMS E2E tests
        timeout-minutes: 25
        run: npx playwright test hrms- --reporter=list

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hrms
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  e2e-hrmsx:
    name: Playwright E2E (HRMS modules ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # About 630 specs: split into four runs that go side by side, so no single run nears its cap.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "browser download failed after 3 attempts"
          exit 1

      # Same best-effort OS deps step as the main job (see the comment there).
      - name: Install Playwright OS deps (best-effort)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo pkill -9 -f apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/apt/lists/lock-frontend \
              /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            if sudo timeout 180 npx playwright install-deps chromium; then
              echo "OS deps installed on attempt $attempt"; exit 0
            fi
            echo "install-deps attempt $attempt stalled/failed; retrying..."
            sleep 5
          done
          echo "install-deps did not complete; continuing (runner likely already has the libs)"

      - name: Run HRMS module E2E tests
        timeout-minutes: 30
        run: npx playwright test hrmsx- --shard=${{ matrix.shard }}/4 --reporter=list

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hrmsx-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  e2e-reports:
    name: Playwright E2E (reports and widgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "browser download failed after 3 attempts"
          exit 1

      # Same best-effort OS deps step as the main job (see the comment there).
      - name: Install Playwright OS deps (best-effort)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo pkill -9 -f apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/apt/lists/lock-frontend \
              /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            if sudo timeout 180 npx playwright install-deps chromium; then
              echo "OS deps installed on attempt $attempt"; exit 0
            fi
            echo "install-deps attempt $attempt stalled/failed; retrying..."
            sleep 5
          done
          echo "install-deps did not complete; continuing (runner likely already has the libs)"

      # Lead Management and Field Force report and widget specs (about 400): their own job, so the main serial
      # suite keeps its headroom under its 33-minute cap.
      - name: Run report and widget E2E tests
        timeout-minutes: 30
        run: npx playwright test "(crm|ffm)-(reports|widgets)-plus" --reporter=list

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-reports
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
