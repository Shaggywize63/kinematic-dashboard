name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Backstop: a healthy run finishes in ~2-3 min. Cap the whole job so a
    # stalled step fails fast (and is diagnosable) instead of hanging for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # Fetch the Chromium binary from Playwright's CDN. This is fast and
      # reliable (no apt), so it stays a hard requirement.
      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "browser download failed after 3 attempts"
          exit 1

      # OS libraries via `playwright install-deps` shell out to apt-get, which
      # has intermittently HUNG on the runner's Ubuntu mirror
      # (azure.archive.ubuntu.com) — and killing a hung apt-get leaves a stale
      # dpkg/apt lock that breaks the next attempt. So: clean stale locks first,
      # cap each attempt with `timeout`, retry — and treat this as best-effort
      # (continue-on-error), because GitHub's ubuntu-latest image already ships
      # Chromium's runtime libs (this is why the suite has passed without it).
      - name: Install Playwright OS deps (best-effort)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo pkill -9 -f apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/apt/lists/lock-frontend \
              /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            if sudo timeout 180 npx playwright install-deps chromium; then
              echo "OS deps installed on attempt $attempt"; exit 0
            fi
            echo "install-deps attempt $attempt stalled/failed; retrying..."
            sleep 5
          done
          echo "install-deps did not complete; continuing (runner likely already has the libs)"

      - name: Run E2E tests
        timeout-minutes: 8
        run: npx playwright test --reporter=list

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
